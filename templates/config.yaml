experiment:
  name: my_experiment
  output_dir: runs/my_experiment

data:
  path: data/MY_ASSET_M5.csv
  datetime_column: datetime
  signal_timeframe: 15min

strategy:
  callable: my_strategy_module:generate_signals
  params: {}

backtest:
  starting_equity: 10000
  risk_fraction: 0.01
  stop_pct: 0.005
  take_profit_pct: 0.010
  max_hold_bars: 96
  commission_bps: 0.0
  slippage_bps: 0.0
  intrabar_priority: stop_first

validation:
  minimum_trades: 100
  maximum_drawdown: 0.20

walk_forward:
  enabled: false
  train_days: 730
  test_days: 180
  step_days: 180
  parameter_grid: {}

factor_ic:
  enabled: false
  horizons_bars: [48, 96, 192]
