name: ci

on:
  push:
  pull_request:

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .[dev]
      - run: pytest -q
      - run: fx-research sample-data --output examples/data/EURUSD_M5_sample.csv
      - run: fx-research run --idea examples/ideas/ma_breakout.md --config examples/configs/ma_breakout.yaml
      - run: test -f runs/example_ma_breakout/reproducibility_report.md
